<svg xmlns="http://www.w3.org/2000/svg" width="380" height="777" viewBox="0 0 380 777">
  <defs>
    <clipPath id="caseClip">
      <rect x="0" y="0" width="380" height="777" rx="53.2" ry="53.2"/>
    </clipPath>
    <linearGradient id="fotoDemo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b26b"/>
      <stop offset="0.4" stop-color="#e06c9f"/>
      <stop offset="0.75" stop-color="#7a5cc9"/>
      <stop offset="1" stop-color="#2c4a8a"/>
    </linearGradient>
    <filter id="caseDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="380" height="777" rx="53.2" ry="53.2" fill="#0c0c0e" filter="url(#caseDrop)"/>

  <g clip-path="url(#caseClip)">
    <rect x="0" y="0" width="380" height="777" fill="url(#fotoDemo)"/>
    <!-- textura da foto demo -->
    <circle cx="266" cy="427.35" r="190" fill="#ffffff" opacity="0.06"/>
    <circle cx="95" cy="621.6" r="152" fill="#000000" opacity="0.08"/>

    <!-- recorte da câmera: espaço vazio (a foto não é impressa aqui) -->
    <rect x="19" y="21.756" width="197.6" height="159.285" rx="38" ry="38" fill="#f4f4f5"/>
    <rect x="19" y="21.756" width="197.6" height="159.285" rx="38" ry="38" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>

  <rect x="0.5" y="0.5" width="379" height="776" rx="53.2" ry="53.2" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>